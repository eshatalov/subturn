# Stages a release on npm when a version tag is pushed: `npm version patch` locally
# makes the commit and the tag, `git push --follow-tags` triggers this. The staged
# version goes live after `npm stage approve <stage-id>` (2FA) or Approve on npmjs.com.
# Auth is npm trusted publishing (OIDC): no token in the repo. The package's
# trusted publisher on npmjs.com must name this file.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ancestry check below needs main's history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5+
      - name: tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tagged commit is not on main"; exit 1; }
      - name: tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          test "$tag" = "$version" || { echo "tag v$tag != package.json $version"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm stage publish --access public
